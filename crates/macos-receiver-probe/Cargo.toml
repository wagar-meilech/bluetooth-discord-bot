[package]
name = "macos-receiver-probe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-io-bluetooth = "0.3.2"
objc2-core-bluetooth = "0.3.2"
objc2-io-bluetooth-ui = { version = "0.3.2", default-features = false, features = ["std", "objc2", "IOBluetoothPairingController", "IOBluetoothDeviceSelectorController", "IOBluetoothUIUserLib", "objc2-io-bluetooth"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication"] }
